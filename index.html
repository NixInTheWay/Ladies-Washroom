<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Weather Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body { 
      background:linear-gradient(135deg, #1e123c 0%, #2a5298 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .weather-card {
      background: linear-gradient(135deg, #2a5298 0%,#1e123c 100%);
      backdrop-filter: blur(10px);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .location-header {
      margin-bottom: 12px;
    }

    .location-header h2 {
      font-size: 1.5rem;
      color: #1a202c;
    }

    .status {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 20px;
    }

    .temp-container {
      margin: 16px 0;
    }

    .temp {
      font-size: 3.5rem;
      font-weight: 700;
      color: #2b6cb0;
      line-height: 1;
    }

    .description {
      font-size: 1rem;
      color: #4a5568;
      text-transform: capitalize;
      margin-top: 8px;
      font-weight: 500;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .detail-card {
      background: #f7fafc;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 0.75rem;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d3748;
    }

    button {
      margin-top: 24px;
      padding: 12px;
      background: #443514;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }

    button:hover {
      background: #2b6cb0;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <div class="location-header">
      <h2 id="city-name">Chernobyl</h2>
      <div id="status" class="status">Loading live weather...</div>
    </div>
    
    <div class="temp-container">
      <div id="temp" class="temp">--°C</div>
      <div id="description" class="description">--</div>
    </div>
    
    <div class="details-grid">
      <div class="detail-card">
        <span class="detail-label">Feels Like</span>
        <span id="feels-like" class="detail-value">--°C</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Humidity</span>
        <span id="humidity" class="detail-value">--%</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Wind</span>
        <span id="wind" class="detail-value">-- m/s</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Pressure</span>
        <span id="pressure" class="detail-value">-- hPa</span>
      </div>
    </div>

    <button onclick="getWeather()">Refresh Data</button>
  </div>

  <script>
    const LAT = "9.0889"; // Amritapuri latitude
    const LON = "7.4872"; // Amritapuri longitude

    // Helper map to convert WMO weather codes to human-readable descriptions
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Foggy", 48: "Depositing rime fog",
      51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
      61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow",
      80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
      95: "Thunderstorm"
    };

    async function getWeather() {
      const statusEl = document.getElementById("status");
      const tempEl = document.getElementById("temp");
      const descEl = document.getElementById("description");
      const feelsLikeEl = document.getElementById("feels-like");
      const humidityEl = document.getElementById("humidity");
      const windEl = document.getElementById("wind");
      const pressureEl = document.getElementById("pressure");

      statusEl.textContent = "Fetching weather...";

      // Open-Meteo endpoint (No API key needed)
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,wind_speed_10m,weather_code`;

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`API Error Status: ${response.status}`);
        }

        const data = await response.json();
        const current = data.current;
        console.log("Current Weather Data:", current);

        // Populate HTML elements
        tempEl.textContent = `${Math.round(current.temperature_2m)}°C`;
        descEl.textContent = weatherCodes[current.weather_code] || "Live Weather";
        feelsLikeEl.textContent = `${Math.round(current.apparent_temperature)}°C`;
        humidityEl.textContent = `${current.relative_humidity_2m}%`;
        
        // Convert km/h to m/s to match UI formatting (1 km/h = ~0.27778 m/s)
        const windMs = (current.wind_speed_10m / 3.6).toFixed(1);
        windEl.textContent = `${windMs} m/s`;
        
        pressureEl.textContent = `${Math.round(current.surface_pressure)} hPa`;

        statusEl.textContent = "Updated just now";

      } catch (error) {
        console.error("Error fetching weather data:", error);
        statusEl.textContent = "Failed to load weather data.";
      }
    }

    // Fetch on initial launch
    getWeather();
  </script>

</body>
</html>
